id: com.github.ryonakano.pinit
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: com.github.ryonakano.pinit
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  # For drawing icons
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
modules:
  - name: pinit
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/ryonakano/pinit.git
        tag: 2.3.0
        commit: 13a2c2185ead39f835bfc67d2e2550940bf4da10
